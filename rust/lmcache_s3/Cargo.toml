[package]
name = "lmcache_s3"
version = "0.1.0"
edition = "2021"

[lib]
name = "lmcache_s3"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# AWS SDK for S3 (existing high-level SDK)
aws-sdk-s3 = "1.68"
aws-config = "1.5"
aws-smithy-runtime-api = "1.7"

# Memory management
memmap2 = "0.9"
parking_lot = "0.12"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
log = "0.4"
tracing = "0.1"
dashmap = "6.0"
once_cell = "1.19"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
